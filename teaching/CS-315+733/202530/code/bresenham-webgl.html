<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bresenham WebGL2 (ESM)</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{display:flex;flex-direction:column;height:100%}
    header{padding:8px 12px;background:#111;color:#fff;display:flex;align-items:center;gap:12px}
    header h1{font-size:14px;margin:0}
    #canvas{flex:1;display:block;width:100%}
    .controls{padding:8px 12px;background:#f6f6f6;color:#111;font-size:13px}
    button{margin-right:8px}
    small{opacity:.8}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bresenham Line Demo — WebGL2 & ESM</h1>
      <small>Click two points to draw a line. Keys: <code>c</code> clear, <code>r</code> random, <code>a</code> animate</small>
    </header>
    <div id="canvas-wrap" style="position:relative;flex:1">
      <canvas id="canvas" style="display:block;width:100%;height:100%"></canvas>
      <canvas id="overlay" style="position:absolute;left:0;top:0;pointer-events:none;width:100%;height:100%"></canvas>
    </div>
    <div class="controls">
      <button id="btn-clear">Clear (c)</button>
      <button id="btn-random">Random (r)</button>
      <button id="btn-animate">Animate (a)</button>
      <label style="margin-left:12px">Pixel Size:
        <input id="pixel-size-range" type="range" min="1" max="128" step="1" value="2" style="vertical-align:middle;margin-left:6px">
        <span id="pixel-size-val" style="margin-left:6px">2</span>
      </label>
      <label style="margin-left:12px">Preset:
        <select id="pixel-preset" style="margin-left:6px">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="8">8</option>
          <option value="16">16</option>
          <option value="32">32</option>
          <option value="64">64</option>
          <option value="128">128</option>
        </select>
      </label>
      <label style="margin-left:8px"><input id="snap-toggle" type="checkbox" style="vertical-align:middle"> Snap slider to preset</label>
      <label style="margin-left:12px"><input id="grid-toggle" type="checkbox" checked style="vertical-align:middle"> Show grid</label>
      <label style="margin-left:8px"><input id="fill-toggle" type="checkbox" style="vertical-align:middle"> Fill pixels</label>
      <span id="grid-res" style="margin-left:8px;opacity:.9">Grid: 0×0</span>
      <span id="status" style="margin-left:12px"></span>
    </div>
  </div>

  <script type="module" src="./bresenham-webgl.mjs"></script>
</body>
</html>
