<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hinged Cubes (WebGL2)</title>
  <style>body{color:#e8e8e8;background:#1b1d22;margin:1rem;font-family:system-ui,sans-serif}#gl-canvas{aspect-ratio:4/3;cursor:grab;touch-action:none;background:#101216;border-radius:6px;width:100%;max-width:800px;display:block}#gl-canvas:active{cursor:grabbing}#controls{grid-template-columns:auto 1fr auto;align-items:center;gap:.5rem .75rem;max-width:800px;margin-top:.75rem;display:grid}#controls output{font-variant-numeric:tabular-nums;text-align:right;min-width:4.5em}#controls .row{grid-column:1/-1;align-items:center;gap:1rem;display:flex}.hint{opacity:.7;max-width:800px;margin-top:.5rem;font-size:.85rem}</style>
  <script type="module" crossorigin src="../../../assets/experimental/built/hinged-cubes/app-DKESaWua.js"></script>
  <link rel="modulepreload" crossorigin href="../../../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="../../../assets/MV-Cpj122kB.js">
  <link rel="modulepreload" crossorigin href="../../../assets/initShadersJS-BssXODEH.js">
</head>
<body>
  <canvas id="gl-canvas"></canvas>

  <div id="controls">
    <label for="angle">Hinge angle</label>
    <input id="angle" type="range" min="0" max="180" step="0.5" value="90">
    <output id="angle-out" for="angle">90.0&deg;</output>

    <label for="speed">Animation speed</label>
    <input id="speed" type="range" min="10" max="360" step="5" value="60">
    <output id="speed-out" for="speed">60&deg;/s</output>

    <div class="row">
      <label><input id="animate" type="checkbox"> Animate</label>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>

  <p class="hint">
    Drag on the canvas to orbit. 0&deg; = the cubes sit flush (a 2&times;1&times;1 slab);
    180&deg; = flush again on the opposite side. Between those the cubes only touch along the hinge edge.
  </p>

</body>
</html>
