<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle diffusion ping-pong on a cube and sphere (WebGL2)</title>
  <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{color:#d8dbe3;background:#0a0b0f;height:100%;margin:0;font:13px/1.4 system-ui,sans-serif;overflow:hidden}canvas{touch-action:none;cursor:grab;width:100%;height:100%;display:block;position:fixed;inset:0}canvas:active{cursor:grabbing}#panel{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:#12141cd1;border:1px solid #2a2e3b;border-radius:10px;width:250px;max-height:calc(100% - 24px);padding:12px 14px;position:fixed;top:12px;left:12px;overflow:auto}h1{margin:0 0 8px;font-size:14px;font-weight:600}label{margin:8px 0 0;display:block}label>span{color:#9aa0b2;justify-content:space-between;display:flex}output{font-variant-numeric:tabular-nums;color:#d8dbe3}input[type=range]{width:100%;margin:2px 0 0}select,button{width:100%;color:inherit;font:inherit;background:#1d2030;border:1px solid #333850;border-radius:6px;margin-top:4px;padding:4px 6px}button{cursor:pointer}button:hover{background:#262a40}.row{gap:8px;display:flex}.row>*{flex:1}.check{color:#d8dbe3;align-items:center;gap:6px;margin-top:8px;display:flex}hr{border:0;border-top:1px solid #2a2e3b;margin:10px 0 2px}#stats{color:#7d8398;font-size:12px;position:fixed;bottom:10px;left:12px}#hint{color:#7d8398;text-align:right;font-size:12px;position:fixed;top:12px;right:14px}#error{white-space:pre-wrap;background:#3a1418;border:1px solid #8a2a33;border-radius:10px;padding:16px;font-family:ui-monospace,monospace;position:fixed;inset:20% 10%}</style>
  <script type="module" crossorigin src="../../../assets/experimental/modular/diffusion-cube/app-DM3r2bdG.js"></script>
  <link rel="modulepreload" crossorigin href="../../../assets/modulepreload-polyfill-P2Xu9kJm.js">
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="panel">
    <h1>Particle diffusion · ping-pong</h1>

    <label><span>Shape</span>
      <select id="shape">
        <option value="both">Cube + sphere</option>
        <option value="cube">Cube</option>
        <option value="sphere">Sphere</option>
      </select>
    </label>

    <label><span>Particles</span>
      <select id="particles">
        <option value="256">65,536</option>
        <option value="512" selected>262,144</option>
        <option value="1024">1,048,576</option>
      </select>
    </label>

    <label><span>Initial condition</span>
      <select id="source">
        <option value="point">Point source</option>
        <option value="ring">Ring</option>
        <option value="uniform">Uniform</option>
      </select>
    </label>
    <button id="reset" type="button">Reset</button>

    <hr>
    <label><span>Random-walk step <output></output></span>
      <input type="range" data-target="sim" data-key="sigma" min="0.0002" max="0.006" step="0.0001" data-digits="4"></label>
    <label><span>Chemotaxis (− flee / + cluster) <output></output></span>
      <input type="range" data-target="sim" data-key="chemo" min="-1" max="1" step="0.05" data-digits="2"></label>
    <label><span>Field diffusion <output></output></span>
      <input type="range" data-target="sim" data-key="diffuse" min="0" max="1" step="0.01" data-digits="2"></label>
    <label><span>Field decay <output></output></span>
      <input type="range" data-target="sim" data-key="decay" min="0.9" max="0.999" step="0.001" data-digits="3"></label>
    <label><span>Deposit <output></output></span>
      <input type="range" data-target="sim" data-key="deposit" min="0.002" max="0.1" step="0.002" data-digits="3"></label>
    <label><span>Steps / frame <output></output></span>
      <input type="range" data-target="sim" data-key="stepsPerFrame" min="1" max="8" step="1" data-digits="0"></label>
    <label><span>Exposure <output></output></span>
      <input type="range" data-target="view" data-key="exposure" min="0.1" max="8" step="0.1" data-digits="1"></label>

    <label class="check"><input id="rotate" type="checkbox" checked> Auto-rotate</label>
    <label class="check"><input id="pause" type="checkbox"> Pause simulation</label>
    <label class="check"><input id="texture" type="checkbox" checked> Show raw texture</label>
  </div>

  <div id="hint">drag to orbit · wheel to zoom</div>
  <div id="stats"></div>
  <pre id="error" hidden></pre>

</body>
</html>
