# .github/workflows/site-checks.yml
# Runs the Rake test pipeline (data:validate → wiki:validate → build → test:html).
# Replaces the earlier Python-based version (generate_config.py / test_links.py),
# which predated the per-offering model and the html-proofer Ruby API move.

name: Site checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]   # builds while you work on the branch
  workflow_dispatch:                    # manual "Run workflow" button

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24' # Forces the runner environment to Node 24
          cache: npm
          cache-dependency-path: teaching/CS-315/202630/code/CS315/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # single source of truth (same as deploy-uregina.yml)
          bundler-cache: true            # bundle install + gem cache, keyed on Gemfile.lock

      # Build the CS315 Vite samples to static files in code/CS315/dist/ BEFORE
      # Jekyll runs, so Jekyll copies dist/ into _site like any other static dir.
      # VITE_BASE is the deployed URL path of dist/ on this host (github.io paths; html-proofer sees the built pages).
      - name: Build CS315 Vite samples
        working-directory: teaching/CS-315/202630/code/CS315
        env:
          VITE_BASE: /teaching/CS-315/202630/code/CS315/dist/
        run: |
          npm ci
          npx vite build

      # `rake` with no args runs the default task:
      #   data:validate  wiki:validate  build  test:html
      # cheapest checks first, aborting on the first failure.
      - name: Run the full check pipeline
        run: bundle exec rake
