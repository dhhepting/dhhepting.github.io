# .github/workflows/site-checks.yml
# Runs the Rake test pipeline (data:validate → wiki:validate → build → test:html).
# Replaces the earlier Python-based version (generate_config.py / test_links.py),
# which predated the per-offering model and the html-proofer Ruby API move.

name: Site checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, upgrade-2026 ]   # builds while you work on the branch
  workflow_dispatch:                    # manual "Run workflow" button

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # single source of truth (same as deploy-uregina.yml)
          bundler-cache: true            # bundle install + gem cache, keyed on Gemfile.lock

      # `rake` with no args runs the default task:
      #   data:validate  wiki:validate  build  test:html
      # cheapest checks first, aborting on the first failure.
      - name: Run the full check pipeline
        run: bundle exec rake
