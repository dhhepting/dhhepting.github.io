# .github/workflows/site-checks.yml
# Runs the full Rake pipeline (`rake`): yaml:duplicate_keys → structure:validate →
# wiki:validate → meetings:check_all → test:unit → build → code:listings → test:html.

name: Site checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:                    # manual "Run workflow" button

permissions:
  contents: read

# A newer push to the same ref makes the older check run pointless.
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one place the term-specific path lives in this file.
  CS315_DIR: teaching/CS-315/202630/code/CS315

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none   # full commit/tree history; file contents only for the commit being built
          filter: blob:none   # full commit/tree history; file contents only for the checked-out commit
          
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.CS315_DIR }}/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # single source of truth (same as deploy-uregina.yml)
          bundler-cache: true            # bundle install + gem cache, keyed on Gemfile.lock

      - name: Check YAML for duplicate keys
        run: bundle exec rake yaml:duplicate_keys
        
      # Fail fast if the checkout is shallow, before the slower steps run.
      - name: Check for full git history
        run: bundle exec rake changes:check

      # Build the CS315 Vite samples to static files in dist/ BEFORE Jekyll
      # runs, so Jekyll copies dist/ into _site like any other static dir.
      # vite.config.js uses base: './', so html-proofer sees correct relative paths.
      - name: Build CS315 Vite samples
        working-directory: ${{ env.CS315_DIR }}
        run: |
          npm ci
          npx vite build

      # `rake` with no args runs the default task (see the Rakefile header):
      # cheapest checks first, aborting on the first failure.
      - name: Run the full check pipeline
        run: bundle exec rake