# .github/workflows/site-checks.yml
# Runs the Rake test pipeline (data:validate → wiki:validate → build → test:html).

name: Site checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:                    # manual "Run workflow" button

env:
  # The one place the term-specific path lives in this file.
  CS315_DIR: teaching/CS-315/202630/code/CS315

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.CS315_DIR }}/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # single source of truth (same as deploy-uregina.yml)
          bundler-cache: true            # bundle install + gem cache, keyed on Gemfile.lock

      # Build the CS315 Vite samples to static files in dist/ BEFORE Jekyll
      # runs, so Jekyll copies dist/ into _site like any other static dir.
      # vite.config.js uses base: './', so html-proofer sees correct relative paths.
      - name: Build CS315 Vite samples
        working-directory: ${{ env.CS315_DIR }}
        run: |
          npm ci
          npx vite build

      # `rake` with no args runs the default task:
      #   data:validate  wiki:validate  build  test:html
      # cheapest checks first, aborting on the first failure.
      - name: Run the full check pipeline
        run: bundle exec rake