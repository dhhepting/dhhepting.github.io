name: Site checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch: 

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Ruby version
        id: ruby-version
        run: |
          if [ -f .ruby-version ]; then
            echo "version=$(cat .ruby-version)" >> $GITHUB_OUTPUT
          else
            echo "version=3.4.7" >> $GITHUB_OUTPUT
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby-version.outputs.version }}

      - name: Install Bundler and gems
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Set up Python (for config generation)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps (config generation)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate active Jekyll config
        run: |
          python3 scripts/generate_config.py

      - name: Build site
        run: |
          bundle exec jekyll build --config _config_active.yml

      - name: Run html-proofer
        run: |
          bundle exec htmlproofer ./_site --config-file _htmlproofer.yml

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python site checks
        run: |
          python3 scripts/test_links.py
