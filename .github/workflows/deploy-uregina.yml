# .github/workflows/deploy-uregina.yml
# Builds the site and rsyncs _site/ to titan.cs.uregina.ca — the CI equivalent
# of your script/urbuild. This is a SEPARATE workflow from your GitHub Pages
# deploy; the two live side by side, one per host.

name: Deploy to U of R server

on:
  push:
    branches: [ master ]      # deploy automatically when master updates
  workflow_dispatch:       # ...and give yourself a manual "Run workflow" button
  schedule:
    # 12:00 UTC == 06:00 Regina (fixed -06:00, no DST).
    # Daily, so the current -> next rollover is live by the morning a term starts.
    - cron: "0 12 * * *"
permissions:
  contents: read

# Never let two deploys race over rsync.  Queue instead of cancel: cancelling a
# run in the middle of `rsync --delete` would leave the live site half-synced.
concurrency:
  group: deploy-uregina
  cancel-in-progress: false

env:
  # The one place the term-specific path lives in this file.
  CS315_DIR: teaching/CS-315/202630/code/CS315

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.CS315_DIR }}/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # single source of truth
          bundler-cache: true            # installs gems from Gemfile.lock and caches them

      # Fail fast if the checkout is shallow, before the slower steps run.
      - name: Check for full git history
        run: bundle exec rake changes:check

      # Cheap source checks (seconds), before the slow steps.  The full pipeline,
      # including html-proofer, runs in site-checks.yml.
      - name: Validate sources and run unit tests
        run: bundle exec rake yaml:duplicate_keys structure:validate test:unit

      # Build the CS315 Vite samples to static files in dist/ BEFORE Jekyll
      # runs, so Jekyll copies dist/ into _site like any other static dir.
      # vite.config.js uses base: './', so no per-host base path is needed.
      - name: Build CS315 Vite samples
        working-directory: ${{ env.CS315_DIR }}
        run: |
          npm ci
          npx vite build

      # This is your urbuild build line, unchanged.
      - name: Build site
        run: bundle exec jekyll build --config "_config.yml,_config_uregina.yml"

      - name: Generate static directory listings
        run: bundle exec rake code:listings

      # SAFETY GUARD. Your rsync uses --delete, which mirrors _site/ onto the
      # server: anything not in _site/ gets deleted on titan. If a build ever
      # silently produces an empty/broken _site/, --delete would wipe your live
      # site. These checks refuse to deploy unless the site root AND the Vite
      # output exist.
      - name: Sanity-check the build
        run: |
          test -s _site/index.html || { echo "Build looks empty — refusing to deploy."; exit 1; }
          test -s "_site/$CS315_DIR/dist/Samples/ColourCube/app.html" || { echo "Vite samples missing from _site — refusing to deploy."; exit 1; }
          # The changes feature fails silently, so check its output explicitly.
          test -s _site/changes/index.html || { echo "changes page missing — refusing to deploy."; exit 1; }
          test -s _site/changes.xml || { echo "changes feed missing — refusing to deploy."; exit 1; }
          test -s "_site/${CS315_DIR%/code/CS315}/changes/index.html" || { echo "CS-315 changes page missing — refusing to deploy."; exit 1; }
          grep -q 'https://www2.cs.uregina.ca/~hepting/' _site/changes.xml || { echo "feed URLs have the wrong host — refusing to deploy."; exit 1; }

      # Hand the runner the deploy key and teach it to trust titan.
      - name: Set up SSH
        env:
          TITAN_SSH_KEY: ${{ secrets.TITAN_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TITAN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan titan.cs.uregina.ca >> ~/.ssh/known_hosts

      # Your urbuild rsync line, with -e added so rsync uses the deploy key.
      - name: Deploy with rsync
        run: |
          rsync -avzh --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            _site/ hepting@titan.cs.uregina.ca:public_html