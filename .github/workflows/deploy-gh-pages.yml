name: Build and Deploy (gh-pages)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # 12:00 UTC == 06:00 Regina (fixed -06:00, no DST).
    # Daily, so the current -> next rollover is live by the morning a term starts.
    - cron: "0 12 * * *"
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24' # Forces the runner environment to Node 24

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version   # single source of truth
          bundler-cache: true           # installs gems + caches them

      - name: Install Bundler
        run: gem install bundler

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build site
        run: bundle exec jekyll build -d _site --config "_config.yml,_config_github.yml"

      - name: Generate static directory listings
        run: bundle exec rake code:listings

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          # keep_history: true
