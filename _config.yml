baseurl: /~hepting
canonical: https://www2.cs.uregina.ca/~hepting

# Single declared location for the global reference tables — both
# OfferingsIndexGenerator (build time) and TeachingDataValidator (rake
# data:validate) read from here, so the real path only needs to be
# correct in one place.

# teaching_data:

anchors:
  tlo: topics_learning_outcomes

collections:
  wiki_starts:
    output: true
    permalink: /wiki-starts/:path/
  meeting_pages:
    output: true
    permalink: /meeting-pages/:path/
  # NOTE: output: false means no pages are generated for this collection,
  # so `permalink` below is currently inert.
  assignments:
    output: false
    permalink: /teaching/:collection/:path/:categories/:title:output_ext
  gallery:
    output: true
    permalink: /projects/fractals/:collection/:title:output_ext
  # NOTE: no `:path` component here — two notes with the same `:title` in
  # different subdirectories will collide at the same output URL.
  notes:
    output: true
    permalink: /teaching/:collection/:title:output_ext
  posts:
    output: true
    permalink: /:categories/:title:output_ext
  works:
    output: true
    permalink: /research/:collection/:title:output_ext

defaults:
  - scope:
      path: "_wiki_starts"
    values:
      render_with_liquid: false
  - scope:
      path: "_meeting_pages"
    values:
      render_with_liquid: false
  - scope:
      path: ""
    values:
      author: "Daryl H. Hepting"
      description: >-
        Professor of Computer Science, University of Regina. Ph.D. from Simon
        Fraser University. Augmenting human abilities to embrace diversity.
email: daryl.hepting@uregina.ca
encoding: utf-8
exclude:
- lib
- test
- Rakefile
- vendor
- Gemfile
- Gemfile.lock
- 0_nonweb/
- 1_offweb/
- Gemfile
- Gemfile.lock
- about/0_nonweb/
- assets/0_nonweb/
- deploy_rsa
- deploy_rsa.enc
- projects/0_nonweb/
- research/0_nonweb/
- research/funding/0_nonweb/
- research/students/0_nonweb/
- research/works/0_nonweb/
- script/
- vendor/
github_username: dhhepting
keep_files:
- assets/works
lang: en-CA
markdown: kramdown
plugins:
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-redirect-from
timezone: America/Regina
tipue_search:
  exclude:
    categories:
    files:
    - search.html
    tags:
  include:
    collections:
    - works
    - notes
    - gallery
    pages: true

