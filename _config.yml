baseurl: /~hepting

# Single declared location for the global reference tables — both
# OfferingsIndexGenerator (build time) and TeachingDataValidator (rake
# data:validate) read from here, so the real path only needs to be
# correct in one place.

# teaching_data:

anchors:
  tlo: topics_learning_outcomes

# Paste into _config.yml (or _config_github.yml).  Everything except repo_url
# is optional.

changes:
  repo_url: https://github.com/dhhepting/dhhepting.github.io

  limit: 50          # entries per feed
  max_files: 15      # files listed per feed entry, then "...and N more files"   (item 5)
  page_limit: 100    # rows in the /changes/ table                                (item 5)

  # Commits that should not move dates or appear in feeds: bulk reformats,
  # mass renames.  Find candidates with:  bundle exec rake 'changes:bulk[50]'
  ignore_revs: .changes-ignore-revs                                              # (item 4)

  # Never published: directory prefixes or globs.  A glob matches a path or any
  # parent directory; a glob without "/" matches names at any depth.
  exclude:                                                                       # (item 2)
    - _question_bank/
    - teaching/CS-315/202630/code/CS315/dist/
    - teaching/CS-315/202630/code/CS315/public/
    - '*.swp'

  # "Pages matching `page` are built from the files in `from`, so they change when
  # those do."  `page` is a regexp for the whole source path; its named groups
  # fill in %{name} in `from`.  (Not `on:` -- YAML turns that key into `true`.)
  # CHECK THE `from` PATHS against your repo first:
  #   git ls-files | grep -E 'offering\.yml|plan\.yml'
  depends:                                                                       # (item 3)
    - page: 'teaching/(?<course>[^/]+)/(?<term>\d{6})/index\.md'
      from:
        - '_data/teaching/%{course}/%{term}/'

  feeds:                                                                         # (item 1)
    - path: changes.xml
      title: Site changes
    - path: teaching/CS-315/202630/changes.xml
      title: CS-315 changes
      only:
        - teaching/CS-315/202630/
        - _meeting_pages/CS-315/202630/
changes:
  enabled: true
  repo_url: https://github.com/dhhepting/dhhepting.github.io
  # site_url for uregina.ca
  #site_url: https://www2.cs.uregina.ca/~hepting # optional; default is `url` + `baseurl`.
#                                    # Root of THIS host's site, baseurl included:
#                                    # feed readers need absolute URLs.
  limit: 50                      # entries per feed
  only: []                       # path prefixes to include; [] = everything
  exclude: [_assignments,_question_bank/]     # path prefixes never to publish
  feeds:
  - path: changes.xml
    title: Site changes
  - path: teaching/CS-315/202630/changes.xml   # example; adjust
    title: CS-315 changes
    only: [teaching/CS-315/202630/]

collections:
  wiki_starts:
    output: true
    permalink: /wiki-starts/:path/
  meeting_pages:
    output: true
    permalink: /wiki/:path/
  # NOTE: output: false means no pages are generated for this collection,
  # so `permalink` below is currently inert.
  assignments:
    output: false
    permalink: /teaching/:collection/:path/:categories/:title:output_ext
  gallery:
    output: true
    permalink: /projects/fractals/:collection/:title:output_ext
  # NOTE: no `:path` component here — two notes with the same `:title` in
  # different subdirectories will collide at the same output URL.
  notes:
    output: true
    permalink: /teaching/:collection/:title:output_ext
  posts:
    output: true
    permalink: /:categories/:title:output_ext
  works:
    output: true
    permalink: /research/:collection/:title:output_ext

defaults:
  - scope:
      path: "_wiki_starts"
    values:
      render_with_liquid: false
  - scope:
      path: "_meeting_pages"
    values:
      render_with_liquid: false
  - scope:
      path: ""
    values:
      author: "Daryl H. Hepting"
      description: >-
        Professor of Computer Science, University of Regina. Ph.D. from Simon
        Fraser University. Augmenting human abilities to embrace diversity.
email: daryl.hepting@uregina.ca
encoding: utf-8
exclude:
- "**/node_modules"
- lib
- test
- Rakefile
- vendor
- Gemfile
- Gemfile.lock
- script/
- scripts/
- 0_nonweb/
- 1_offweb/
- "**/0_nonweb"
- "**/1_offweb"
- Gemfile
- Gemfile.lock
- about/0_nonweb/
- assets/0_nonweb/
- deploy_rsa
- deploy_rsa.enc
- projects/0_nonweb/
- research/0_nonweb/
- research/funding/0_nonweb/
- research/students/0_nonweb/
- research/works/0_nonweb/
- script/
- vendor/
github_username: dhhepting
keep_files:
- assets/works
lang: en-CA
markdown: kramdown
plugins:
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-redirect-from
timezone: America/Regina
tipue_search:
  exclude:
    categories:
    files:
    - search.html
    tags:
  include:
    collections:
    - works
    - notes
    - gallery
    pages: true

