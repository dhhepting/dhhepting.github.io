# Configuration for html-proofer
check_html: true
allow_hash_href: true
assume_extension: true
disable_external: true
ignore_urls:
  - "/mailto:"
  - "/tel:"
  # Ignore tipue search assets (these are sometimes generated or hosted elsewhere)
  - "/~hepting/assets/tipuesearch"
  - "/~hepting/assets/tipuesearch/"
  # Anchored regexes to ignore missing files under the baseurl assets prefix
  - '^/~hepting/assets/.*'
  - '^/~hepting/assets$'

# You can add other ignores or patterns here when needed.
