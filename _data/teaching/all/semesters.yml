
# semesters.yml — hand-authored source of truth for semester-level detail.
#
# Conventions:
#   * `semester` is the U of R term code: YYYY + term, where term is
#       10 = Winter, 20 = Spring/Summer, 30 = Fall.
#     year and the season name are NOT stored here — they are the one thing
#     the code already encodes. _plugins/semester_generator.rb derives
#     `year` and `semester_name` at build time and injects them, so Liquid can
#     still use {{ s.year }} / {{ s.semester_name }}.
#   * Dates are ISO 8601 (YYYY-MM-DD). YAML loads these as real Date objects,
#     so Liquid/Ruby can compare and format them and they sort as plain text.
#   * The class_end -> term_end span is the final-exam period.
#   * Each no_class_days entry carries a `label` so a calendar or syllabus can
#     caption it instead of showing a bare date.
#   * office_hours are structured (day/start/end); times are quoted so YAML
#     does not read "10:00" as a number.
#
# This file is validated at build time by _plugins/semester_generator.rb:
# a bad edit fails `jekyll build`, and therefore fails CI, instead of
# rendering wrong.

