# _data/teaching/all/curricula/CS2023/GIT/Physical.yml
ku: GIT-Physical
title: Tangible/Physical Computing
description: >
  Tangible/Physical Computing refers to microcontroller-based interactive
  systems that detect and respond to sensor input.

topics:
  - id: physical-world
    curriculum_level: knowledge-area
    text: "Interaction with the physical world"
    see_also: [SPD-Embedded]
    items:
      - text: "Acquisition of data from sensors"
      - text: "Driving external actuators"
  - id: physical-artifacts
    curriculum_level: knowledge-area
    text: "Connection to physical artifacts"
    items:
      - text: "Computer-Aided Design (CAD)"
      - text: "Computer-Aided Manufacturing (CAM)"
      - text: "Fabrication"
        see_also: [HCI-Design]
        items:
          - text: "Prototyping"
          - text: "Additive (3D printing)"
          - text: "Subtractive (Computer Numerical Control (CNC) milling)"
          - text: "Forming (vacuum forming)"
  - id: iot
    curriculum_level: knowledge-area
    text: "Internet of Things"
    see_also: [SPD-Interactive]
    items:
      - text: "Network connectivity"
      - text: "Wireless communication"

learning_outcomes:
  - id: o01
    curriculum_level: knowledge-area
    text: "Construct a simple virtual switch or application button and use it to turn on an LED."
  - id: o02
    curriculum_level: knowledge-area
    text: "Construct a simple system to move a servo in response to sensor data."
  - id: o03
    curriculum_level: knowledge-area
    text: "Create a circuit and accompanying microcontroller code that uses a light sensor to vary a property of something else (e.g., color or brightness of an LED or graphic, position of an external actuator)."
  - id: o04
    curriculum_level: knowledge-area
    text: "Create a circuit with a variable resistor and write a microcontroller program that reads and responds to the resistor's changing values."
  - id: o05
    curriculum_level: knowledge-area
    text: "Create a 3D form in a CAD package."
    items:
      - text: "Show how affine transformations are achieved in the CAD program."
      - text: "Show an example of instances of an object."
      - text: "Create a fabrication plan. Provide a cost estimate for materials and time. How will you fabricate it?"
      - text: "Fabricate it. How closely did your actual fabrication process match your plan? Where did it differ?"
  - id: o06
    curriculum_level: knowledge-area
    text: "Write the G- and M-Code to construct a 3D maze and use a CAD/CAM package to check your work."
  - id: o07
    curriculum_level: knowledge-area
    text: "Decide and defend your decision to use Ethernet, WiFi, Bluetooth, RFID/NFC, or something else for internet connectivity when designing an IoT pill dispenser. Create an IoT pill dispenser."
  - id: o08
    curriculum_level: knowledge-area
    text: "Distinguish between the different types of fabrication and describe when you would use each."
