# _data/teaching/all/curricula/CS2023/GIT/Simulation.yml
ku: GIT-Simulation
title: Simulation
description: >
  Simulation has strong ties to Computational Science. However, in the
  graphics domain, simulation techniques are re-purposed to a different end.
  Rather than creating predictive models, the goal instead is to achieve a
  mixture of physical plausibility and artistic intention. To illustrate, the
  goals of "model surface tension in a liquid" and "produce a crown splash"
  are related, but different. Depending on the simulation goals, covered
  topics may vary as shown.

