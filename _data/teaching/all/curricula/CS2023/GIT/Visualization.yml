# _data/teaching/all/curricula/CS2023/GIT/Visualization.yml
ku: GIT-Visualization
title: Visualization
description: >
  Visualization seeks to determine and present underlying correlated
  structures and relationships in data sets from a wide variety of application
  areas. The prime objective is to communicate the information in a way which
  enhances understanding.

topics:
  - id: sci-info-vis
    curriculum_level: knowledge-area
    text: "Scientific Data Visualization and Information Visualization"
  - id: techniques
    curriculum_level: knowledge-area
    text: "Visualization techniques"
    items:
      - text: "Statistical visualization (e.g., scatterplots, bar graphs, histograms, line graphs, pie charts, trees, and graphs)"
      - text: "Text visualization"
      - text: "Geospatial visualization"
      - text: "2D/3D scalar fields"
      - text: "Vector fields"
      - text: "Direct volume rendering"
  - id: pipeline
    curriculum_level: knowledge-area
    text: "Visualization pipeline"
    items:
      - text: "Structuring data"
      - text: "Mapping data to visual representations (e.g., scales, grammar of graphics)"
      - text: "View transformations (e.g., pan, zoom, filter, select)"
  - id: data-formats
    curriculum_level: knowledge-area
    text: "Common data formats (e.g., HDF, netCDF, geotiff, GeoJSON, shape files, raw binary, JSON, CSV, plain text)"
  - id: high-dimensional
    curriculum_level: knowledge-area
    text: "High-dimensional data handling techniques"
    items:
      - text: "Statistical (e.g., averaging, clustering, filtering)"
      - text: "Perceptual (e.g., multi-dimensional vis, parallel coordinates, trellis plots)"
  - id: perceptual-cognitive
    curriculum_level: knowledge-area
    text: "Perceptual and cognitive foundations that drive visual abstractions."
    items:
      - text: "Human optical system"
      - text: "Color theory"
      - text: "Gestalt theories"
  - id: design-evaluation
    curriculum_level: knowledge-area
    text: "Design and evaluation of visualizations"
    items:
      - text: "Purpose (e.g., analysis, communication, aesthetics)"
      - text: "Accessibility"
      - text: "Appropriateness of encodings"
      - text: "Misleading visualizations"

learning_outcomes:
  - id: o01
    curriculum_level: knowledge-area
    text: "Compare and contrast data visualization and information visualization."
  - id: o02
    curriculum_level: knowledge-area
    text: "Deploy basic algorithms for visualization."
  - id: o03
    curriculum_level: knowledge-area
    text: "Compare the tradeoffs of visualization algorithms in terms of accuracy and performance."
  - id: o04
    curriculum_level: knowledge-area
    text: "Design a suitable visualization for a particular combination of data characteristics, application tasks, and audience."
  - id: o05
    curriculum_level: knowledge-area
    text: "Analyze the effectiveness of a given visualization for a particular task."
  - id: o06
    curriculum_level: knowledge-area
    text: "Design a process to evaluate the utility of a visualization algorithm or system."
  - id: o07
    curriculum_level: knowledge-area
    text: "Identify a variety of applications of visualization including representations of scientific, medical, and mathematical data; flow visualization; and spatial analysis."
