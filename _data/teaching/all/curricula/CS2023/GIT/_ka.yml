# Knowledge-Area-level metadata for GIT. The leading underscore sorts it ahead
# of the KU files and marks it as area meta, not a knowledge unit. One per KA.
#
# This is the home for the long preamble you captured in preamble_GIT — it is a
# KA fact, authored once, not repeated in each KU. `overview` optionally holds
# the "Overview of Knowledge Units" prose. `default_skill` records the KA's own
# guidance (see below) rather than tagging every outcome.

code: GIT
name: "Graphics and Interactive Techniques"

# CS2023 GIT states its core-topic skill level is mostly "Explain," rising to
# "Apply"/"Develop" when a KU is taught as a full course. That is KA-level
# guidance — so record it here, once, instead of per-outcome Bloom tags (that
# was the CS2013 model, which GIT explicitly moved away from).
default_skill: Explain

preamble: >
  Computer graphics is the term used to describe the computer generation and
  manipulation of images and can be viewed as the science of enabling visual
  communication through computation. Its application domains include animation,
  CGI and VFX; engineering; machine learning; medical imaging; scientific,
  information, and knowledge visualization; simulators; special effects; user
  interfaces; and video games.
