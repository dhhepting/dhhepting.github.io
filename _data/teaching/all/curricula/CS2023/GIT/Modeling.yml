# _data/teaching/all/curricula/CS2023/GIT/Modeling.yml
ku: GIT-Modeling
title: Geometric Modeling
description: >
  Graphics must be encoded in computer memory, often in the form of a
  mathematical specification of shape and form.

topics:
  - id: geometric-operations
    curriculum_level: knowledge-area
    text: "Basic geometric operations such as intersection calculation and proximity tests on 2D objects"
  - id: surface
    curriculum_level: knowledge-area
    text: "Surface representation/model"
    items:
      - text: "Tessellation"
      - text: "Mesh representation, mesh fairing, and mesh generation techniques such as Delaunay triangulation, and marching cubes/tetrahedrons"
      - text: "Parametric polynomial curves and surfaces"
      - text: "Implicit representation of curves and surfaces"
      - text: "Spatial subdivision techniques"
  - id: volumetric
    curriculum_level: knowledge-area
    text: "Volumetric representation/model"
    items:
      - text: "Volumes, voxels, and point-based representations."
      - text: "Signed Distance Fields"
      - text: "Sparse Volumes, i.e., VDB"
      - text: "Constructive Solid Geometry (CSG) representation"
  - id: procedural
    curriculum_level: knowledge-area
    text: "Procedural representation/model"
    items:
      - text: "Fractals"
      - text: "L-Systems"
  - id: multi-resolution
    curriculum_level: knowledge-area
    text: "Multi-resolution modeling"
    see_also: [SPD-Game]
  - id: reconstruction
    curriculum_level: knowledge-area
    text: "Reconstruction, e.g., 3D scanning, photogrammetry"

learning_outcomes:
  - id: o01
    curriculum_level: knowledge-area
    text: "Contrast representing curves and surfaces in both implicit and parametric forms."
  - id: o02
    curriculum_level: knowledge-area
    text: "Create simple polyhedral models by surface tessellation."
  - id: o03
    curriculum_level: knowledge-area
    text: "Create a mesh representation from an implicit surface."
  - id: o04
    curriculum_level: knowledge-area
    text: "Create a fractal model or terrain using a procedural method."
  - id: o05
    curriculum_level: knowledge-area
    text: "Create a mesh from data points acquired with a laser scanner."
  - id: o06
    curriculum_level: knowledge-area
    text: "Create CSG models from simple primitives, such as cubes and quadric surfaces."
  - id: o07
    curriculum_level: knowledge-area
    text: "Contrast modeling approaches with respect to space and time complexity and quality of image."
