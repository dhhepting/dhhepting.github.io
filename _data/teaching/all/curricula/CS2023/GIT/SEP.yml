# _data/teaching/all/curricula/CS2023/GIT/SEP.yml
ku: GIT-SEP
title: Society, Ethics, and the Profession

topics:
  - id: accessibility
    curriculum_level: knowledge-area
    text: "Accessibility in immersive, interactive, and physical computing applications"
    see_also: [SEP-DEIA]
    items:
      - text: "Accessible to people with mobility impairments"
      - text: "Accessible to people with vision and/or hearing impairments"
  - id: ethics-privacy
    curriculum_level: knowledge-area
    text: "Ethics/privacy in graphics applications."
    see_also: [SEP-Privacy, SEP-Professional-Ethics, SEP-Security]
    items:
      - text: "Acquisition of private data (room scans, body proportions, active cameras, etc.)"
      - text: "Can't look away from immersive applications easily"
      - text: "Danger to self/surroundings while immersed"
      - text: "Ethical pitfalls of facial recognition"
      - text: "Misleading visualizations"
        items:
          - text: "Due to incorrect data because of exaggeration, hole filling, smoothing, data cleanup, etc."
          - text: "Even correct data can mislead (e.g., aliasing can cause back moving or stopped fan blades)"
      - text: "Privacy regarding health and other personal information"
      - text: "Bias in image processing"
        items:
          - text: "Deep fakes"
          - text: "Applications that misidentify people based on skin color or hairstyle"
  - id: ip-law
    curriculum_level: knowledge-area
    text: "Intellectual Property law as it relates to computer graphics and interactive techniques"
    see_also: [SEP-IP]
    items:
      - text: "images used to train generative AI"
      - text: "images produced by generative AI"
  - id: contributors
    curriculum_level: knowledge-area
    text: "Current and past contributors to the field"
    see_also: [SEP-DEIA]

learning_outcomes:
  - id: o01
    curriculum_level: knowledge-area
    text: "Discuss the security issues inherent in location tags."
  - id: o02
    curriculum_level: knowledge-area
    text: "Describe the ethical pitfalls of facial recognition. Can facial recognition be used ethically? If so, how?"
  - id: o03
    curriculum_level: knowledge-area
    text: "Discuss the copyright issues of using watermarked images to train a neural network."
