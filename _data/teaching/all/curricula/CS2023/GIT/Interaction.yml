# _data/teaching/all/curricula/CS2023/GIT/Interaction.yml
ku: GIT-Interaction
title: Interaction
description: >
  Interactive computer graphics is a requisite part of real-time applications
  ranging from the utilitarian-like word processors to virtual and/or
  augmented reality applications.

