  admin_notes:
  - Everyone who submitted a response received full marks, but making a thoughtful response means giving some thought to what you write and following the instructions.
  r2r:
  - text: _How is the discretization of a continuous phenomenon achieved with regards to understanding the pixels of a display or an image?_
    items:
    - Each pixel on a display of an image shows the value of a discrete sample of the continuous phenomenon
  - text: _Do pixels have a specific size?_
    items:
    - 'No'
  - text: _Can you provide a full course syllabus on UR Courses?_
    items:
    - 'Yes'
  - text: _I had a hard time understanding some concepts_
    items:
    - Please don't hesitate to ask questions during the meeting (if you are comfortable with that), send me email using UR Courses, or post to the class discussion forum on UR Courses.
  - text: _The concept of pixels being a continuous concept rather than a discrete concept. It seems to go against what I understood pixels to be before today._
    items:
    - Pixels are discrete samples of a continuous phenomenon
  - text: _If a pixel can be any shape and size how do all screen appear to show non-stretched images?_
    items:
    - Pixels as discrete samples of a continuous phenomenon do not have size nor shape. On modern screens, these samples are displayed equally spaced in x and y (resulting in a grid of squares). To avoid stretching an image, preserve the aspect ratio
  - text: _I would like to know more about what is aliasing_
    items:
    - Aliasing in computer graphics refers to jagged features apparent on what should be smooth lines and curves. It is a problem of insufficient sampling
  - text: _It was mentioned that a part of our participation marks could be gained through wiki contribution. What is meant by this and how do we contribute to the wiki?_
    items:
    - text: I've added some information in UR Courses (under the Participation topic). It is not strictly necessary to sign up to edit the wiki, you can just do it (see Using Wiki for an introduction to wiki editing
      url: https://docs.moodle.org/404/en/Using_Wiki
  - text: _How can we get to volunteer to participate in research through the participant pool?_
    items:
    - Opportunities to participate in research will be advertised on UR Courses
  - text: _Would it be possible to get the course lecture slides?_
    items:
    - Yes. I am adding the textbook slides in a folder under the Meetings topic in UR Courses. The meeting pages will have other information covered during our class meetings
